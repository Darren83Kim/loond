# EPIC 5-1: daily TourAPI + culture-portal worker → published JSON → app assets
# Requires repo secrets: TOUR_API_SERVICE_KEY and CULTURE_API_SERVICE_KEY
#   (CULTURE_API_SERVICE_KEY optional at runtime — missing key skips culture with warning)
#   SEOUL_OPEN_API_KEY is optional — missing key skips Seoul reservation APPLY
name: daily-loond-worker

on:
  schedule:
    # 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          if [ -f worker/requirements.txt ]; then pip install -r worker/requirements.txt; fi
          pip install requests

      # R26: run_tour_daily exits non-zero without writing opportunities.json when
      # the fetch fails or TourAPI returns resultCode 22. Later steps do not run,
      # so the previous feed stays. The failure() issue step alerts ops.
      - name: Run TourAPI collect (KorService2)
        env:
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${TOUR_API_SERVICE_KEY:-}" ]; then
            echo "TOUR_API_SERVICE_KEY secret missing — failing so the schedule is visible."
            exit 1
          fi
          # Prefer dedicated runner module when present; fall back to tour_collect verify.
          if [ -f worker/loond_worker/run_tour_daily.py ]; then
            cd worker && python -m loond_worker.run_tour_daily
          else
            echo "run_tour_daily.py not yet present — running area verify stub only."
            cd worker && python -m loond_worker.tour_collect
          fi

      # After TourAPI (preserves culture_portal rows), refresh culture ENJOY.
      # Soft-skip when CULTURE_API_SERVICE_KEY is absent so TourAPI daily is not blocked.
      - name: Run culture-portal collect
        env:
          CULTURE_API_SERVICE_KEY: ${{ secrets.CULTURE_API_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${CULTURE_API_SERVICE_KEY:-}" ]; then
            echo "WARN: CULTURE_API_SERVICE_KEY secret missing — skipping culture collect."
            exit 0
          fi
          cd worker && python -m loond_worker.culture_collect

      # National experience APPLY (TourAPI keyword).
      # R26: on quota/fetch failure the script keeps previous apply rows and
      # exits non-zero. This step still continues so a good TourAPI/culture
      # publish can commit; the job fails after commit so an issue is opened.
      - name: Run TourAPI experience APPLY collect
        id: tour_apply
        env:
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${TOUR_API_SERVICE_KEY:-}" ]; then
            echo "WARN: TOUR_API_SERVICE_KEY missing — skip tour_apply (previous rows kept)"
            exit 0
          fi
          set +e
          (cd worker && python -m loond_worker.tour_apply_collect)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "retained=true" >> "$GITHUB_OUTPUT"
            echo "WARN: tour_apply_collect exit=$code — previous TourAPI apply rows kept (R26). Job fails after commit."
          fi

      # Busan municipal occation APPLY — soft-fail (overseas IP may block)
      - name: Run Busan occation APPLY collect
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd worker && python -m loond_worker.busan_collect --pages 27 || {
            echo "WARN: busan_collect failed — continuing"
            exit 0
          }

      # Seoul public-reservation APPLY — soft-fail (missing key or overseas IP)
      # Failure keeps previous seoul-yeyak rows. Do not fail the job (unlike R26).
      - name: Run Seoul reservation APPLY collect
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${SEOUL_OPEN_API_KEY:-}" ]; then
            echo "WARN: SEOUL_OPEN_API_KEY secret missing — skip seoul_collect (previous rows kept)."
            echo "Add the Actions secret to publish 서울시 공공서비스예약. See docs/ops/seoul-reservation.md"
            exit 0
          fi
          cd worker && python -m loond_worker.seoul_collect || {
            echo "WARN: seoul_collect failed — previous seoul rows kept, continuing"
            exit 0
          }

      - name: Sync published → app assets + region feeds
        run: |
          python scripts/sync_published_assets.py

      - name: Commit published data if changed
        run: |
          git config user.name "loond-bot"
          git config user.email "loond-bot@users.noreply.github.com"
          git add data/published/opportunities.json data/published/manifest.json data/published/regions app/assets/data/opportunities.json data/raw || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily TourAPI + culture publish refresh"
            git push
          fi

      # R26: apply-collect kept the previous rows. Commit of other feeds already
      # happened; fail afterwards so the R16 issue step still runs.
      - name: Surface TourAPI apply retain (R26)
        if: success() && steps.tour_apply.outputs.retained == 'true'
        run: |
          echo "R26: tour_apply_collect kept the previous apply feed after a fetch/quota failure."
          echo "Other published updates from this run were committed. Failing so ops get an issue."
          exit 1

      # R16: MVP failure notify — open a GitHub Issue (GITHUB_TOKEN only)
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DAY="$(date -u +%Y-%m-%d)"
          BODY="Workflow **daily-loond-worker** failed.

          - Run: ${RUN_URL}
          - Ref: \`${{ github.ref }}\`
          - Actor: ${{ github.actor }}

          R26: TourAPI 조회 실패·한도(resultCode 22)로 멈춘 경우 이전 피드는 git과 Pages에 그대로입니다. 다른 원인일 수 있으니 로그를 확인하세요.
          If this run died on a TourAPI fetch or quota error (resultCode 22), the previous published feed was left in place. Other failures may be unrelated — check the log.

          _Auto-opened by Actions (R16). Close after triage._"
          gh issue create --title "[daily-worker] failed — ${DAY}" --body "${BODY}"
