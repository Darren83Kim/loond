# EPIC 5-1: daily TourAPI worker → published JSON → app assets
# Requires repo secret: TOUR_API_SERVICE_KEY (Decoding/Encoding key for KorService2)
name: daily-loond-worker

on:
  schedule:
    # 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          if [ -f worker/requirements.txt ]; then pip install -r worker/requirements.txt; fi
          pip install requests

      - name: Run TourAPI collect (KorService2)
        env:
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TOUR_API_SERVICE_KEY:-}" ]; then
            echo "TOUR_API_SERVICE_KEY secret missing — failing so the schedule is visible."
            exit 1
          fi
          # Prefer dedicated runner module when present; fall back to tour_collect verify.
          if [ -f worker/loond_worker/run_tour_daily.py ]; then
            cd worker && python -m loond_worker.run_tour_daily
          else
            echo "run_tour_daily.py not yet present — running area verify stub only."
            cd worker && python -m loond_worker.tour_collect
          fi

      - name: Sync published → app assets
        run: |
          python scripts/sync_published_assets.py

      - name: Commit published data if changed
        run: |
          git config user.name "loond-bot"
          git config user.email "loond-bot@users.noreply.github.com"
          git add data/published/opportunities.json app/assets/data/opportunities.json data/raw || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily TourAPI publish refresh"
            git push
          fi
